<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Responsive countdown timer built with HTML5, CSS3 and JavaScript.">

    <title>Countdown Timer | Veda Technology</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="countdown-section">

            <header class="hero">
                <p class="eyebrow">VEDA TECHNOLOGY • TASK 13</p>

                <h1>Countdown Timer</h1>

                <p class="subtitle">
                    Stay focused. Every second brings you closer to your goal.
                </p>
            </header>

            <div class="timer-card">

                <div class="target-info">
                    <span class="target-label">COUNTDOWN TO</span>
                    <h2 id="target-date">Loading target date...</h2>
                </div>

                <div class="timer-grid">

                    <div class="time-box">
                        <span id="days">00</span>
                        <small>Days</small>
                    </div>

                    <div class="time-box">
                        <span id="hours">00</span>
                        <small>Hours</small>
                    </div>

                    <div class="time-box">
                        <span id="minutes">00</span>
                        <small>Minutes</small>
                    </div>

                    <div class="time-box">
                        <span id="seconds">00</span>
                        <small>Seconds</small>
                    </div>

                </div>

                <div id="message" class="message" aria-live="polite">
                    Countdown is running...
                </div>

            </div>

            <footer class="footer">
                <p>HTML5 • CSS3 • JavaScript</p>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
